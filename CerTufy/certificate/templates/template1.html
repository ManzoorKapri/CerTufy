<!-- certificate/templates/template1.html -->
<!-- Classic Template - Double Border & Gold Seal -->
<style>
  .certufy-certificate.classic {
    background: #fefcf5;
    border: 8px double #cc0000;
    padding: 35px 40px;
    position: relative;
    font-family: 'Playfair Display', 'Georgia', serif;
  }

  .certufy-certificate.classic::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    bottom: 12px;
    border: 2px solid #cc0000;
    pointer-events: none;
  }

  .certufy-certificate.classic .certufy-cert-seal {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at 30% 30%, #ffd700, #d4a017);
    border-radius: 50%;
    border: 5px solid #b8860b;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(184, 134, 11, 0.3);
    animation: certufy-seal-glow 3s ease-in-out infinite;
  }

  @keyframes certufy-seal-glow {
    0%, 100% { box-shadow: 0 0 20px rgba(184, 134, 11, 0.3); }
    50% { box-shadow: 0 0 40px rgba(184, 134, 11, 0.6); }
  }

  .certufy-certificate.classic .certufy-cert-seal-text {
    font-size: 11px;
    font-weight: 900;
    color: #8B6914;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 1px;
  }

  .certufy-certificate.classic .certufy-cert-seal-text span {
    display: block;
    font-size: 24px;
    margin-bottom: 2px;
  }

  .certufy-certificate.classic .certufy-cert-title {
    font-size: 32px;
    font-weight: 900;
    color: #1a1a1a;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .certufy-certificate.classic .certufy-cert-subtitle {
    font-size: 14px;
    color: #666666;
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .certufy-certificate.classic .certufy-cert-name {
    font-size: 38px;
    font-weight: 700;
    color: #cc0000;
    margin: 12px 0;
    font-family: 'Playfair Display', serif;
    text-shadow: 0 1px 2px rgba(204, 0, 0, 0.1);
  }

  .certufy-certificate.classic .certufy-cert-divider {
    width: 100px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #cc0000, transparent);
    margin: 12px auto;
  }

  .certufy-certificate.classic .certufy-cert-details {
    font-size: 15px;
    color: #555555;
    font-family: 'Inter', sans-serif;
    line-height: 1.8;
    margin: 6px 0;
  }

  .certufy-certificate.classic .certufy-cert-details strong {
    color: #1a1a1a;
    font-weight: 600;
  }

  .certufy-certificate.classic .certufy-cert-code {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: #888888;
    background: #f5f0e8;
    padding: 4px 16px;
    border-radius: 4px;
    letter-spacing: 2px;
    margin-top: 10px;
    display: inline-block;
    border: 1px solid #e8e0d8;
  }

  .certufy-certificate.classic .certufy-cert-footer-text {
    font-size: 12px;
    color: #999999;
    font-family: 'Inter', sans-serif;
    margin-top: 18px;
    letter-spacing: 1px;
  }

  .certufy-certificate.classic .certufy-cert-decoration {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    color: #cc0000;
    opacity: 0.3;
    letter-spacing: 8px;
  }
</style>
