<!-- certificate/templates/template2.html -->
<!-- Modern Template - Gradient Background -->
<style>
  .certufy-certificate.modern {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #ffffff;
    border: none;
    padding: 40px 50px;
    position: relative;
    overflow: hidden;
    font-family: 'Playfair Display', 'Georgia', serif;
  }

  .certufy-certificate.modern::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  .certufy-certificate.modern::after {
    content: '✦';
    position: absolute;
    bottom: 20px;
    right: 30px;
    font-size: 60px;
    opacity: 0.1;
    color: #ffffff;
  }

  .certufy-certificate.modern .certufy-cert-title {
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-subtitle {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-name {
    font-size: 36px;
    font-weight: 700;
    color: #ffffff;
    margin: 12px 0;
    font-family: 'Playfair Display', serif;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-divider {
    width: 80px;
    height: 3px;
    background: rgba(255, 255, 255, 0.5);
    margin: 12px auto;
    border-radius: 2px;
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-details {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.9);
    font-family: 'Inter', sans-serif;
    line-height: 1.8;
    margin: 6px 0;
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-details strong {
    color: #ffffff;
    font-weight: 600;
  }

  .certufy-certificate.modern .certufy-cert-code {
    font-family: 'Courier New', monospace;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.15);
    padding: 4px 16px;
    border-radius: 4px;
    letter-spacing: 2px;
    margin-top: 10px;
    display: inline-block;
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-footer-text {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-family: 'Inter', sans-serif;
    margin-top: 18px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
  }

  .certufy-certificate.modern .certufy-cert-icon {
    position: absolute;
    top: 20px;
    left: 30px;
    font-size: 40px;
    opacity: 0.15;
  }

  /* Gradient animation */
  @keyframes certufy-gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .certufy-certificate.modern {
    background-size: 200% 200%;
    animation: certufy-gradient-shift 8s ease-in-out infinite;
  }
</style>
